# =============================================================================
# CALIBRE – Docker Compose
# =============================================================================
# Start with:  docker compose up --build
# =============================================================================

services:
  # ── Kafka (KRaft mode, no Zookeeper) ──────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: calibre
      POSTGRES_PASSWORD: calibre
      POSTGRES_DB: calibre
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calibre"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── CALIBRE API ───────────────────────────────────────────────────────
  calibre-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env.example
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DATABASE_URL=postgresql+asyncpg://calibre:calibre@postgres:5432/calibre
      - DATABASE_URL_SYNC=postgresql://calibre:calibre@postgres:5432/calibre
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ── CALIBRE Replay Producer ──────────────────────────────────────────
  calibre-replay:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "replay.producer", "--speed", "10"]
    env_file: .env.example
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DATABASE_URL=postgresql+asyncpg://calibre:calibre@postgres:5432/calibre
      - DATABASE_URL_SYNC=postgresql://calibre:calibre@postgres:5432/calibre
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - replay   # only starts with: docker compose --profile replay up

  # ── CALIBRE Stream Processor ─────────────────────────────────────────
  calibre-processor:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "streaming.processor"]
    env_file: .env.example
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DATABASE_URL=postgresql+asyncpg://calibre:calibre@postgres:5432/calibre
      - DATABASE_URL_SYNC=postgresql://calibre:calibre@postgres:5432/calibre
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  kafka_data:
  pg_data:
