contract_id: lap_time_consistency
version: "1.0"
epoch: 1
effective_from: "2026-01-01T00:00:00Z"
decision_type: timing_consistency
decision_scope:
  scope_class: DRIVER_LAP
  scope_key_pattern: "{session_id}|{driver_id}|lap{lap_number}"
formula: "AND(lap_record, lap_start_reference)"
roles:
  lap_record:
    required: true
    description: "Official lap duration and completion event from TracingInsights session laptimes"
    input_selector:
      feeds: [laps, laptimes, session_laptimes]
      value_field: lap_duration
      unit: s
    time_class_required: SESSION_ELAPSED
    admissible_source_origins:
      - TRACINGINSIGHTS_LAPS
    admissible_processing_origins:
      - timing_parser_family
    agreement:
      metric: abs_diff
      unit: s
      tolerance_eta: 0.05
      calibration_ref: CAL-CALIB-TIMING-001
      honest_noise_epsilon_h: 0.005
    freshness:
      soft_age_s: null
      hard_age_s: null
      latency_allowance_s: 2.0
    corroboration:
      source: INFORMATIONAL
      processing: INFORMATIONAL
      source_min_depth: 0
      processing_min_depth: 0
    fault_model:
      source_fault_budget: 0
      processing_fault_budget: 0
    slots:
      trigger: lap_completed
      max_obs_per_slot: 1
      deadline_s: 30.0
      allowed_lateness_s: 60.0
  lap_start_reference:
    required: true
    description: "Start-of-lap session elapsed timestamp reference fact (lST)"
    time_class_required: SESSION_ELAPSED
    admissible_source_origins:
      - TRACINGINSIGHTS_LAPS
    admissible_processing_origins:
      - timing_parser_family
    agreement:
      metric: abs_diff
      unit: s
      tolerance_eta: 0.05
      calibration_ref: CAL-CALIB-TIMING-001
      honest_noise_epsilon_h: 0.005
    freshness:
      soft_age_s: null
      hard_age_s: null
      latency_allowance_s: 2.0
    corroboration:
      source: INFORMATIONAL
      processing: INFORMATIONAL
      source_min_depth: 0
      processing_min_depth: 0
    fault_model:
      source_fault_budget: 0
      processing_fault_budget: 0
    slots:
      trigger: lap_completed
      max_obs_per_slot: 1
      deadline_s: 30.0
      allowed_lateness_s: 60.0
simultaneity_window_s: 1.0
finality:
  condition: all_slots_closed_and_frontier_past_lateness
tie_break: canonical_order
explanation:
  template_id: lap_time_consistency_v1
limitations:
  - "UNMODELLED_COMMON_CAUSE: shared F1 timing upstream"
  - "HISTORICAL_ARCHIVE_UNCALIBRATED_LATENCY"
