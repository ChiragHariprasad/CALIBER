contract_id: session_status_transition
version: "1.0"
epoch: 1
effective_from: "2026-01-01T00:00:00Z"
decision_type: safety_status
decision_scope:
  scope_class: SESSION
  scope_key_pattern: "{session_id}"
formula: "AND(status_event, clock_reference)"
roles:
  status_event:
    required: true
    description: "Session status state change (Inactive -> Started -> Finished -> Finalised)"
    time_class_required: ABSOLUTE_UTC
    admissible_source_origins:
      - PITWALL_SESSION_DATA
    admissible_processing_origins:
      - session_parser_family
    agreement:
      metric: discrete_equality
      unit: enum
      tolerance_eta: 0.0
      calibration_ref: CAL-CALIB-SESSION-001
      honest_noise_epsilon_h: 0.0
    freshness:
      soft_age_s: 10.0
      hard_age_s: 30.0
      latency_allowance_s: 2.0
    corroboration:
      source: INFORMATIONAL
      processing: INFORMATIONAL
      source_min_depth: 0
      processing_min_depth: 0
    fault_model:
      source_fault_budget: 0
      processing_fault_budget: 0
    slots:
      trigger: session_transition
      max_obs_per_slot: 2
      deadline_s: 15.0
      allowed_lateness_s: 30.0
  clock_reference:
    required: true
    description: "Extrapolated session running clock reference timestamp"
    time_class_required: ABSOLUTE_UTC
    admissible_source_origins:
      - PITWALL_CLOCK
    admissible_processing_origins:
      - clock_parser_family
    agreement:
      metric: temporal_delta
      unit: s
      tolerance_eta: 1.0
      calibration_ref: CAL-CALIB-CLOCK-001
      honest_noise_epsilon_h: 0.1
    freshness:
      soft_age_s: 5.0
      hard_age_s: 15.0
      latency_allowance_s: 1.0
    corroboration:
      source: INFORMATIONAL
      processing: INFORMATIONAL
      source_min_depth: 0
      processing_min_depth: 0
    fault_model:
      source_fault_budget: 0
      processing_fault_budget: 0
    slots:
      trigger: periodic
      max_obs_per_slot: 1
      deadline_s: 5.0
      allowed_lateness_s: 10.0
simultaneity_window_s: 1.0
finality:
  condition: all_slots_closed_and_frontier_past_lateness
tie_break: canonical_order
explanation:
  template_id: session_status_transition_v1
limitations:
  - "UNMODELLED_COMMON_CAUSE: shared F1 timing upstream"
