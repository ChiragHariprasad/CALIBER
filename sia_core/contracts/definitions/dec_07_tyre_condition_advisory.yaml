contract_id: tyre_condition_advisory
version: "1.0"
epoch: 1
effective_from: "2026-01-01T00:00:00Z"
decision_type: tyre_lifecycle
decision_scope:
  scope_class: DRIVER_LAP
  scope_key_pattern: "{session_id}|{driver_id}|lap{lap_number}"
formula: "AND(stint_record, tyre_compound_data)"
roles:
  stint_record:
    required: true
    description: "Tyre stint history and lap life counter from TimingAppData"
    time_class_required: SESSION_ELAPSED
    admissible_source_origins:
      - PITWALL_TIMING_APP
    admissible_processing_origins:
      - timing_app_parser_family
    agreement:
      metric: abs_diff
      unit: laps
      tolerance_eta: 0.0
      calibration_ref: CAL-CALIB-TYRE-001
      honest_noise_epsilon_h: 0.0
    freshness:
      soft_age_s: 60.0
      hard_age_s: 180.0
      latency_allowance_s: 5.0
    corroboration:
      source: INFORMATIONAL
      processing: INFORMATIONAL
      source_min_depth: 0
      processing_min_depth: 0
    fault_model:
      source_fault_budget: 0
      processing_fault_budget: 0
    slots:
      trigger: stint_update
      max_obs_per_slot: 1
      deadline_s: 30.0
      allowed_lateness_s: 60.0
  tyre_compound_data:
    required: true
    description: "Fitted tyre compound indicator (SOFT/MEDIUM/HARD/INTERMEDIATE/WET)"
    time_class_required: SESSION_ELAPSED
    admissible_source_origins:
      - PITWALL_TIMING_APP
    admissible_processing_origins:
      - timing_app_parser_family
    agreement:
      metric: discrete_equality
      unit: enum
      tolerance_eta: 0.0
      calibration_ref: CAL-CALIB-TYRE-001
      honest_noise_epsilon_h: 0.0
    freshness:
      soft_age_s: 60.0
      hard_age_s: 180.0
      latency_allowance_s: 5.0
    corroboration:
      source: INFORMATIONAL
      processing: INFORMATIONAL
      source_min_depth: 0
      processing_min_depth: 0
    fault_model:
      source_fault_budget: 0
      processing_fault_budget: 0
    slots:
      trigger: stint_update
      max_obs_per_slot: 1
      deadline_s: 30.0
      allowed_lateness_s: 60.0
simultaneity_window_s: 10.0
finality:
  condition: all_slots_closed_and_frontier_past_lateness
tie_break: canonical_order
explanation:
  template_id: tyre_condition_advisory_v1
limitations:
  - "UNMODELLED_COMMON_CAUSE: shared F1 timing upstream"
