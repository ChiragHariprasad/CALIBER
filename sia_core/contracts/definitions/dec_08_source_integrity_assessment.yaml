contract_id: source_integrity_assessment
version: "1.0"
epoch: 1
effective_from: "2026-01-01T00:00:00Z"
decision_type: system_health
decision_scope:
  scope_class: SESSION
  scope_key_pattern: "{session_id}"
formula: "AND(guard_liveness, feed_telemetry)"
roles:
  guard_liveness:
    required: true
    description: "Durable supervisor guard fact tracking feed STALLED and RESUMED epochs"
    time_class_required: ABSOLUTE_UTC
    admissible_source_origins:
      - GUARD_SUPERVISOR
    admissible_processing_origins:
      - guard_parser_family
    agreement:
      metric: discrete_equality
      unit: enum
      tolerance_eta: 0.0
      calibration_ref: CAL-CALIB-GUARD-001
      honest_noise_epsilon_h: 0.0
    freshness:
      soft_age_s: 5.0
      hard_age_s: 15.0
      latency_allowance_s: 1.0
    corroboration:
      source: INFORMATIONAL
      processing: INFORMATIONAL
      source_min_depth: 0
      processing_min_depth: 0
    fault_model:
      source_fault_budget: 0
      processing_fault_budget: 0
    slots:
      trigger: event_driven
      max_obs_per_slot: 1
      deadline_s: 5.0
      allowed_lateness_s: 10.0
  feed_telemetry:
    required: true
    description: "Raw feed connection heartbeat and packet gap counters"
    time_class_required: ABSOLUTE_UTC
    admissible_source_origins:
      - PITWALL_HEARTBEAT
    admissible_processing_origins:
      - network_parser_family
    agreement:
      metric: temporal_delta
      unit: s
      tolerance_eta: 2.0
      calibration_ref: CAL-CALIB-NET-001
      honest_noise_epsilon_h: 0.1
    freshness:
      soft_age_s: 5.0
      hard_age_s: 15.0
      latency_allowance_s: 1.0
    corroboration:
      source: INFORMATIONAL
      processing: INFORMATIONAL
      source_min_depth: 0
      processing_min_depth: 0
    fault_model:
      source_fault_budget: 0
      processing_fault_budget: 0
    slots:
      trigger: periodic
      max_obs_per_slot: 1
      deadline_s: 5.0
      allowed_lateness_s: 10.0
simultaneity_window_s: 2.0
finality:
  condition: all_slots_closed_and_frontier_past_lateness
tie_break: canonical_order
explanation:
  template_id: source_integrity_assessment_v1
limitations:
  - "UNMODELLED_COMMON_CAUSE: shared F1 timing upstream"
