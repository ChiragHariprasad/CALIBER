contract_id: pit_lane_timing_evidence
version: "1.0"
epoch: 1
effective_from: "2026-01-01T00:00:00Z"
decision_type: pit_timing
decision_scope:
  scope_class: DRIVER_LAP
  scope_key_pattern: "{session_id}|{driver_id}|lap{lap_number}"
formula: "AND(pit_entry, pit_exit)"
roles:
  pit_entry:
    required: true
    description: "Pit lane entry beam crossing detection and timestamp"
    time_class_required: SESSION_ELAPSED
    admissible_source_origins:
      - PITWALL_TIMINGDATA
    admissible_processing_origins:
      - timing_parser_family
    agreement:
      metric: abs_diff
      unit: s
      tolerance_eta: 0.1
      calibration_ref: CAL-CALIB-PIT-001
      honest_noise_epsilon_h: 0.01
    freshness:
      soft_age_s: 45.0
      hard_age_s: 120.0
      latency_allowance_s: 3.0
    corroboration:
      source: INFORMATIONAL
      processing: INFORMATIONAL
      source_min_depth: 0
      processing_min_depth: 0
    fault_model:
      source_fault_budget: 0
      processing_fault_budget: 0
    slots:
      trigger: pit_event
      max_obs_per_slot: 1
      deadline_s: 60.0
      allowed_lateness_s: 120.0
  pit_exit:
    required: true
    description: "Pit lane exit beam crossing detection and timestamp"
    time_class_required: SESSION_ELAPSED
    admissible_source_origins:
      - PITWALL_TIMINGDATA
    admissible_processing_origins:
      - timing_parser_family
    agreement:
      metric: abs_diff
      unit: s
      tolerance_eta: 0.1
      calibration_ref: CAL-CALIB-PIT-001
      honest_noise_epsilon_h: 0.01
    freshness:
      soft_age_s: 45.0
      hard_age_s: 120.0
      latency_allowance_s: 3.0
    corroboration:
      source: INFORMATIONAL
      processing: INFORMATIONAL
      source_min_depth: 0
      processing_min_depth: 0
    fault_model:
      source_fault_budget: 0
      processing_fault_budget: 0
    slots:
      trigger: pit_event
      max_obs_per_slot: 1
      deadline_s: 60.0
      allowed_lateness_s: 120.0
simultaneity_window_s: 60.0
finality:
  condition: all_slots_closed_and_frontier_past_lateness
tie_break: canonical_order
explanation:
  template_id: pit_lane_timing_evidence_v1
limitations:
  - "UNMODELLED_COMMON_CAUSE: shared F1 timing upstream"
