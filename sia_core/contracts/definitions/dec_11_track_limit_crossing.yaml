contract_id: track_limit_crossing
version: "1.0"
epoch: 1
effective_from: "2026-01-01T00:00:00Z"
decision_type: track_compliance
decision_scope:
  scope_class: DRIVER_LAP
  scope_key_pattern: "{session_id}|{driver_id}|lap{lap_number}"
formula: "AND(car_position, track_boundary)"
roles:
  car_position:
    required: true
    description: "High-precision GPS/optical car perimeter coordinates (x, y, z)"
    time_class_required: LAP_RELATIVE
    admissible_source_origins:
      - SYNTHETIC_PROVIDER_A
      - SYNTHETIC_PROVIDER_B
      - SYNTHETIC_PROVIDER_C
    admissible_processing_origins:
      - synthetic_position_parser_a
      - synthetic_position_parser_b
    agreement:
      metric: abs_diff
      unit: m
      tolerance_eta: 0.05
      calibration_ref: SYNTHETIC-CALIB-001
      honest_noise_epsilon_h: 0.01
    freshness:
      soft_age_s: 1.0
      hard_age_s: 5.0
      latency_allowance_s: 0.2
    corroboration:
      source: MANDATORY
      processing: MANDATORY
      source_min_depth: 1
      processing_min_depth: 1
    fault_model:
      source_fault_budget: 1
      processing_fault_budget: 1
    slots:
      trigger: event_driven
      max_obs_per_slot: 10
      deadline_s: 2.0
      allowed_lateness_s: 5.0
  track_boundary:
    required: true
    description: "Surveyed circuit white line spatial polygon boundaries"
    time_class_required: LAP_RELATIVE
    admissible_source_origins:
      - CIRCUIT_SURVEY_LASER
    admissible_processing_origins:
      - survey_geometry_parser
    agreement:
      metric: abs_diff
      unit: m
      tolerance_eta: 0.01
      calibration_ref: FIA-SURVEY-AUSTIN-2025
      honest_noise_epsilon_h: 0.002
    freshness:
      soft_age_s: null
      hard_age_s: null
      latency_allowance_s: 0.0
    corroboration:
      source: INFORMATIONAL
      processing: INFORMATIONAL
      source_min_depth: 0
      processing_min_depth: 0
    fault_model:
      source_fault_budget: 0
      processing_fault_budget: 0
    slots:
      trigger: session_transition
      max_obs_per_slot: 1
      deadline_s: 1.0
      allowed_lateness_s: 0.0
simultaneity_window_s: 0.1
finality:
  condition: all_slots_closed_and_frontier_past_lateness
tie_break: canonical_order
explanation:
  template_id: track_limit_crossing_v1
limitations:
  - "SYNTHETIC_DATASET_FIXTURE_ONLY"
